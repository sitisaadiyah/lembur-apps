<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d5a27">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lembur">
  
  <title>Form Laporan Hasil Kerja Lembur</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- No external xlsx lib needed - using HTML export -->
  <style>
    :root {
      --bg: #f0ece4;
      --surface: #faf8f4;
      --border: #d4c9b5;
      --border-dark: #a89880;
      --text: #1a1410;
      --text-muted: #6b5e4e;
      --accent: #2d5a27;
      --accent-light: #e8f0e7;
      --accent-hover: #1e3d1a;
      --danger: #8b2020;
      --danger-light: #fdf0f0;
      --row-even: #faf7f2;
      --row-odd: #f4f0e8;
      --header-bg: #2d5a27;
      --shadow: 0 2px 8px rgba(45, 90, 39, 0.08);
      --shadow-lg: 0 8px 32px rgba(45, 90, 39, 0.12);
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* TOPBAR */
    .topbar {
      background: var(--header-bg);
      color: white;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
    }

    .topbar-icon {
      font-size: 22px;
      opacity: .9;
    }

    .topbar-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .04em;
      opacity: .95;
    }

    .topbar-sub {
      font-size: 11px;
      opacity: .6;
      margin-left: auto;
      font-family: 'IBM Plex Mono', monospace;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* CARD */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(to right, #2d5a27, #3a7032);
      color: white;
      padding: 10px 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-body {
      padding: 20px 18px;
    }

    /* FORM */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group.full {
      grid-column: 1/-1;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-family: 'IBM Plex Mono', monospace;
    }

    input[type=text],
    input[type=number],
    input[type=date],
    select,
    textarea {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13.5px;
      color: var(--text);
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      padding: 8px 11px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input[type=text]:focus,
    input[type=number]:focus,
    input[type=date]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.10);
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    select {
      cursor: pointer;
    }

    .month-year-row {
      display: flex;
      gap: 12px;
    }

    .month-year-row select {
      flex: 1;
    }

    /* TABLE */
    .table-wrapper {
      overflow-x: auto;
      margin-top: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      background: var(--accent);
      color: white;
      padding: 9px 10px;
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.15);
      white-space: nowrap;
    }

    tbody tr:nth-child(even) {
      background: var(--row-even);
    }

    tbody tr:nth-child(odd) {
      background: var(--row-odd);
    }

    tbody tr:hover {
      background: var(--accent-light);
    }

    tbody td {
      padding: 7px 8px;
      border: 1px solid var(--border);
      vertical-align: top;
    }

    tbody td input[type=text],
    tbody td input[type=number],
    tbody td input[type=date],
    tbody td textarea,
    tbody td select {
      font-size: 12.5px;
      padding: 5px 7px;
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 3px;
      transition: background .12s, border-color .12s;
    }

    tbody td input[type=text]:focus,
    tbody td input[type=number]:focus,
    tbody td input[type=date]:focus,
    tbody td textarea:focus,
    tbody td select:focus {
      background: white;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(45, 90, 39, 0.08);
    }

    .col-no {
      width: 40px;
      text-align: center;
    }

    .col-tgl {
      width: 150px;
    }

    .col-uraian {
      min-width: 170px;
    }

    .col-bukti {
      width: 160px;
    }

    .col-ket {
      min-width: 190px;
    }

    .col-target {
      width: 58px;
      text-align: center;
    }

    .col-aksi {
      width: 46px;
      text-align: center;
    }

    .no-cell {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      padding-top: 9px;
    }

    /* HARI BADGE */
    .hari-badge {
      display: inline-block;
      margin-top: 3px;
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid #b6d4b2;
      border-radius: 3px;
      padding: 1px 5px;
      font-weight: 600;
      letter-spacing: .03em;
    }

    .hari-badge.weekend {
      background: #fff3e0;
      color: #b35c00;
      border-color: #f0c080;
    }

    /* BUKTI UPLOAD */
    .bukti-cell {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* PASTE ZONE */
    .bukti-paste-zone {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 54px;
      padding: 7px 8px;
      background: white;
      border: 1.5px dashed var(--accent);
      border-radius: 5px;
      cursor: pointer;
      transition: all .15s;
      outline: none;
      user-select: none;
    }

    .bukti-paste-zone:hover,
    .bukti-paste-zone:focus {
      background: var(--accent-light);
      border-color: var(--accent-hover);
    }

    .bukti-paste-zone.drag-over {
      background: #d4edda;
      border-color: #1e3d1a;
      border-style: solid;
      transform: scale(1.01);
    }

    .bukti-paste-zone.active-paste {
      border-color: var(--accent-hover);
      border-style: solid;
      box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.18);
    }

    .paste-icon {
      font-size: 16px;
      line-height: 1;
    }

    .paste-hint {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      font-family: 'IBM Plex Mono', monospace;
      text-align: center;
      line-height: 1.3;
    }

    .paste-hint small {
      font-weight: 400;
      opacity: .7;
      display: block;
      font-size: 9px;
    }

    .paste-file-input {
      display: none;
    }

    /* BUKTI LIST */
    .bukti-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 2px;
    }

    .bukti-item {
      display: flex;
      align-items: center;
      gap: 5px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 5px;
      font-size: 11px;
      max-width: 148px;
    }

    .bukti-thumb {
      width: 30px;
      height: 30px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform .12s;
    }

    .bukti-thumb:hover {
      transform: scale(1.08);
    }

    .bukti-pdf-icon {
      width: 30px;
      height: 30px;
      background: #e74c3c;
      color: white;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      flex-shrink: 0;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
    }

    .bukti-file-icon {
      width: 30px;
      height: 30px;
      background: #7f8c8d;
      color: white;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      flex-shrink: 0;
      font-family: 'IBM Plex Mono', monospace;
    }

    .bukti-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
      color: var(--text-muted);
      min-width: 0;
    }

    .bukti-del {
      background: none;
      border: none;
      cursor: pointer;
      color: #c0392b;
      font-size: 13px;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }

    .bukti-del:hover {
      color: #e74c3c;
    }

    /* ADD ROW */
    .btn-add-row {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--accent-light);
      color: var(--accent);
      border: 1.5px dashed var(--accent);
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'IBM Plex Sans', sans-serif;
      transition: all .15s;
      margin-top: 12px;
    }

    .btn-add-row:hover {
      background: var(--accent);
      color: white;
      border-style: solid;
    }

    /* DELETE BTN */
    .btn-del {
      background: none;
      border: none;
      cursor: pointer;
      color: #c0392b;
      font-size: 15px;
      padding: 4px 6px;
      border-radius: 3px;
      line-height: 1;
      transition: background .12s;
    }

    .btn-del:hover {
      background: var(--danger-light);
    }

    /* TTD */
    .ttd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .ttd-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* ACTIONS */
    .actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      padding: 10px 22px;
      cursor: pointer;
      transition: all .15s;
      letter-spacing: .02em;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 2px 8px rgba(45, 90, 39, 0.25);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(45, 90, 39, 0.28);
    }

    .btn-secondary {
      background: white;
      color: var(--text-muted);
      border: 1.5px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg);
      border-color: var(--border-dark);
    }

    /* MODAL PREVIEW */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      max-width: 880px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
      font-family: 'Times New Roman', serif;
      font-size: 12pt;
      line-height: 1.5;
    }

    .modal-close-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .btn-close {
      background: #888;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 12px;
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 6px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
    }

    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 24px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* PREVIEW DOC */
    .doc-title {
      text-align: center;
      font-size: 14pt;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .doc-subtitle {
      text-align: center;
      font-size: 12pt;
      margin-bottom: 18px;
    }

    .doc-info table {
      border: none;
      width: auto;
    }

    .doc-info td {
      border: none;
      padding: 2px 6px;
      font-size: 11pt;
    }

    .preview-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
      font-size: 10.5pt;
    }

    .preview-table th {
      border: 1px solid #333;
      padding: 6px 8px;
      background: #d9d9d9;
      text-align: center;
      font-weight: bold;
    }

    .preview-table td {
      border: 1px solid #555;
      padding: 5px 7px;
      vertical-align: top;
    }

    .preview-table td.center {
      text-align: center;
    }

    .ttd-preview {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
    }

    .ttd-block {
      text-align: center;
      min-width: 180px;
    }

    .ttd-space {
      height: 52px;
    }

    .bukti-preview-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border: 1px solid #ccc;
      border-radius: 3px;
      cursor: pointer;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--accent);
      color: white;
      padding: 11px 20px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transform: translateY(12px);
      transition: all .25s;
      pointer-events: none;
      z-index: 300;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width:640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .ttd-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 12px 16px;
      }

      .container {
        padding: 14px 10px 50px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <span class="topbar-icon">📋</span>
    <span class="topbar-title">Laporan Hasil Kerja Lembur</span>
    <span class="topbar-sub">Generator Form</span>
  </div>

  <div class="container">

    <!-- IDENTITAS -->
    <div class="card">
      <div class="card-header">👤 Identitas Pegawai</div>
      <div class="card-body">
        <div class="form-grid">
          <div class="form-group">
            <label>Nama Pegawai</label>
            <input type="text" id="nama" placeholder="Nama lengkap + gelar" value="">
          </div>
          <div class="form-group">
            <label>NIP</label>
            <input type="text" id="nip" placeholder="Nomor Induk Pegawai" value="-">
          </div>
          <div class="form-group">
            <label>Unit Kerja</label>
            <input type="text" id="unit" placeholder="Nama unit / bagian" value="SIMRS">
          </div>
          <div class="form-group">
            <label>Bulan &amp; Tahun</label>
            <div class="month-year-row">
              <select id="bulan">
                <option value="JANUARI">Januari</option>
                <option value="FEBRUARI">Februari</option>
                <option value="MARET">Maret</option>
                <option value="APRIL">April</option>
                <option value="MEI">Mei</option>
                <option value="JUNI">Juni</option>
                <option value="JULI">Juli</option>
                <option value="AGUSTUS">Agustus</option>
                <option value="SEPTEMBER">September</option>
                <option value="OKTOBER">Oktober</option>
                <option value="NOVEMBER">November</option>
                <option value="DESEMBER">Desember</option>
              </select>
              <input type="number" id="tahun" min="2000" max="2099" style="width:90px" value="2026">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- DETAIL LEMBUR -->
    <div class="card">
      <div class="card-header">📝 Detail Pekerjaan Lembur</div>
      <div class="card-body">
        <div class="table-wrapper">
          <table id="tbl-lembur">
            <thead>
              <tr>
                <th class="col-no">No</th>
                <th class="col-tgl">Tanggal</th>
                <th class="col-uraian">Uraian Pekerjaan</th>
                <th class="col-bukti">Bukti Fisik</th>
                <th class="col-ket">Keterangan</th>
                <th class="col-target">Target</th>
                <th class="col-aksi">⚙</th>
              </tr>
            </thead>
            <tbody id="tbody-lembur"></tbody>
          </table>
        </div>
        <button class="btn-add-row" onclick="addRow()">＋ Tambah Baris</button>
      </div>
    </div>

    <!-- TTD -->
    <div class="card">
      <div class="card-header">✍️ Tanda Tangan</div>
      <div class="card-body">
        <div class="ttd-grid">
          <div class="ttd-group">
            <label>Ka. Unit Kerja</label>
            <input type="text" id="ttd-kaunit" value="Hartati,S.Kom">
            <label style="margin-top:6px">NIP Ka. Unit Kerja</label>
            <input type="text" id="ttd-kaunit-nip" placeholder="Nomor Induk Pegawai Ka. Unit Kerja" value="">
          </div>
          <div class="ttd-group">
            <label>Yang Bersangkutan</label>
            <input type="text" id="ttd-bersangkutan" value="">
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="resetForm()">🔄 Reset</button>
      <button class="btn btn-secondary" onclick="showPreview()">👁 Preview</button>
      <button class="btn btn-primary" onclick="exportPDF()">🖨️ Cetak / Export PDF</button>
    </div>
  </div>

  <!-- MODAL PREVIEW -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-close-bar">
        <button class="btn-close" onclick="closeModal()">✕ Tutup</button>
      </div>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ── Storage: map rowId -> [{name, dataUrl, type}]
    const buktiStore = {};
    let rowCount = 0;

    // ── DAY NAMES
    const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const WEEKEND = [0, 6]; // Minggu, Sabtu

    function getHariFromDateInput(val) {
      if (!val) return null;
      const d = new Date(val + 'T00:00:00');
      if (isNaN(d)) return null;
      return { name: HARI[d.getDay()], isWeekend: WEEKEND.includes(d.getDay()) };
    }

    function formatTglDisplay(val) {
      // val = "YYYY-MM-DD" -> "DD/MM/YYYY"
      if (!val) return '';
      const [y, m, d] = val.split('-');
      return `${d}/${m}/${y}`;
    }

    // ── ADD ROW
    function addRow(data = {}) {
      rowCount++;
      const id = rowCount;
      buktiStore[id] = data.buktiFiles || [];

      const tbody = document.getElementById('tbody-lembur');
      const tr = document.createElement('tr');
      tr.dataset.rowid = id;

      // Convert DD/MM/YYYY -> YYYY-MM-DD for input[type=date]
      let tglVal = '';
      if (data.tgl) {
        const parts = data.tgl.split('/');
        if (parts.length === 3) tglVal = `${parts[2]}-${parts[1]}-${parts[0]}`;
      }

      tr.innerHTML = `

    <td class="col-tgl">
      <input type="date" class="tgl-input" value="${tglVal}">
    </td>
    <td class="col-uraian"><input type="text" class="uraian-input" placeholder="Uraian pekerjaan..." value="${escHtml(data.uraian || '')}"></td>
    <td class="col-bukti">
      <div class="bukti-cell">
        <div class="bukti-paste-zone" id="paste-zone-${id}" tabindex="0"
          onclick="triggerBuktiFile(${id})"
          ondragover="handleDragOver(event,${id})"
          ondragleave="handleDragLeave(event,${id})"
          ondrop="handleDrop(event,${id})">
          <span class="paste-icon">📋</span>
          <span class="paste-hint">Klik → Ctrl+V paste<br><small>atau drag &amp; drop / browse</small></span>
          <input type="file" class="paste-file-input" id="file-input-${id}" multiple
            accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"
            onchange="handleBuktiUpload(this, ${id})">
        </div>
        <div class="bukti-list" id="bukti-list-${id}"></div>
      </div>

    <td class="col-target"><input type="text" class="target-input" value="100%" style="text-align:center;width:50px"></td>
    <td class="col-aksi"><button class="btn-del" title="Hapus baris" onclick="delRow(this)">✕</button></td>
  `;
      tbody.appendChild(tr);

      // Render pre-existing bukti files
      renderBuktiList(id);
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── BUKTI: trigger file browse
    function triggerBuktiFile(rowId) {
      document.getElementById(`file-input-${rowId}`).click();
    }

    // ── BUKTI: file input browse
    function handleBuktiUpload(input, rowId) {
      const files = Array.from(input.files);
      if (!files.length) return;
      readFilesIntoBukti(files, rowId);
      input.value = '';
    }

    // ── BUKTI: read File objects -> dataUrl -> store
    function readFilesIntoBukti(files, rowId) {
      const readers = files.map(file => new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => resolve({ name: file.name, dataUrl: e.target.result, type: file.type });
        reader.readAsDataURL(file);
      }));
      Promise.all(readers).then(results => {
        buktiStore[rowId] = [...(buktiStore[rowId] || []), ...results];
        renderBuktiList(rowId);
        flashPasteZone(rowId, true);
      });
    }

    // ── BUKTI: PASTE (Ctrl+V) — zone must be focused
    function setupPasteListener() {
      document.addEventListener('paste', function (e) {
        // Find which paste zone is focused
        const focused = document.activeElement;
        if (!focused || !focused.classList.contains('bukti-paste-zone')) return;
        const rowId = parseInt(focused.id.replace('paste-zone-', ''));
        if (!rowId) return;

        const items = Array.from(e.clipboardData.items);
        const imageItems = items.filter(it => it.type.startsWith('image/'));
        if (!imageItems.length) return;

        e.preventDefault();
        const promises = imageItems.map((item, i) => new Promise(resolve => {
          const blob = item.getAsFile();
          const ext = item.type.split('/')[1] || 'png';
          const name = `screenshot_${Date.now()}_${i + 1}.${ext}`;
          const reader = new FileReader();
          reader.onload = ev => resolve({ name, dataUrl: ev.target.result, type: item.type });
          reader.readAsDataURL(blob);
        }));

        Promise.all(promises).then(results => {
          buktiStore[rowId] = [...(buktiStore[rowId] || []), ...results];
          renderBuktiList(rowId);
          flashPasteZone(rowId, true);
        });
      });
    }

    // ── DRAG & DROP
    function handleDragOver(e, rowId) {
      e.preventDefault();
      document.getElementById(`paste-zone-${rowId}`).classList.add('drag-over');
    }
    function handleDragLeave(e, rowId) {
      document.getElementById(`paste-zone-${rowId}`).classList.remove('drag-over');
    }
    function handleDrop(e, rowId) {
      e.preventDefault();
      document.getElementById(`paste-zone-${rowId}`).classList.remove('drag-over');
      const files = Array.from(e.dataTransfer.files);
      if (files.length) readFilesIntoBukti(files, rowId);
    }

    // ── Flash feedback
    function flashPasteZone(rowId, success) {
      const zone = document.getElementById(`paste-zone-${rowId}`);
      if (!zone) return;
      zone.classList.add('active-paste');
      setTimeout(() => zone.classList.remove('active-paste'), 600);
    }

    function renderBuktiList(rowId) {
      const list = document.getElementById(`bukti-list-${rowId}`);
      if (!list) return;
      const items = buktiStore[rowId] || [];
      list.innerHTML = '';
      items.forEach((f, idx) => {
        const div = document.createElement('div');
        div.className = 'bukti-item';

        let iconEl = '';
        if (f.type && f.type.startsWith('image/')) {
          iconEl = `<img class="bukti-thumb" src="${f.dataUrl}" title="${f.name}" onclick="openLightbox('${f.dataUrl}')">`;
        } else if (f.type === 'application/pdf') {
          iconEl = `<div class="bukti-pdf-icon" onclick="openFileTab('${rowId}','${idx}')">PDF</div>`;
        } else {
          iconEl = `<div class="bukti-file-icon">FILE</div>`;
        }

        const shortName = f.name.length > 14 ? f.name.substring(0, 12) + '…' : f.name;
        div.innerHTML = `
      ${iconEl}
      <span class="bukti-name" title="${f.name}">${shortName}</span>
      <button class="bukti-del" onclick="deleteBukti(${rowId},${idx})" title="Hapus file">✕</button>
    `;
        list.appendChild(div);
      });
    }

    function deleteBukti(rowId, idx) {
      buktiStore[rowId].splice(idx, 1);

    }

    function delRow(btn) {

    function renumberRows() {
      // Snapshot semua data dulu sebelum rebuild
      const rows = document.querySelectorAll('#tbody-lembur tr');

      rows.forEach((tr, i) => {
        const oldId = parseInt(tr.dataset.rowid);
        const newId = i + 1;
        if (oldId === newId) {
          // Nomor urut saja yang perlu diupdate
          tr.querySelector('.no-cell').textContent = newId;
          return;
        }

        // Pindahkan buktiStore ke key baru
        buktiStore[newId] = buktiStore[oldId] || [];
        if (oldId !== newId) delete buktiStore[oldId];

        // Update dataset
        tr.dataset.rowid = newId;

        // Update nomor urut
        tr.querySelector('.no-cell').textContent = newId;

        // Update semua ID elemen dalam baris
        const pasteZone = tr.querySelector('.bukti-paste-zone');
        if (pasteZone) {
          pasteZone.id = `paste-zone-${newId}`;
          pasteZone.setAttribute('onclick', `triggerBuktiFile(${newId})`);
          pasteZone.setAttribute('ondragover', `handleDragOver(event,${newId})`);
          pasteZone.setAttribute('ondragleave', `handleDragLeave(event,${newId})`);
          pasteZone.setAttribute('ondrop', `handleDrop(event,${newId})`);
        }

        const fileInput = tr.querySelector('.paste-file-input');
        if (fileInput) {
          fileInput.id = `file-input-${newId}`;
          fileInput.setAttribute('onchange', `handleBuktiUpload(this, ${newId})`);
        }

        const buktiList = tr.querySelector('.bukti-list');
        if (buktiList) buktiList.id = `bukti-list-${newId}`;

        // Re-render bukti list supaya onclick index-nya juga benar
        renderBuktiList(newId);

      rowCount = rows.length;
    }

      const regSW = () => navigator.serviceWorker.register('sw.js')
        .catch(err => console.warn('SW gagal:', err));
      if (document.readyState === 'complete') regSW();
      else window.addEventListener('load', regSW);
    }
  </script>
</body>
